name: Release

# Cada push na main gera uma nova versão (0.1.<número do build>) e publica
# no GitHub Releases — os apps instalados atualizam sozinhos (electron-updater).
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write   # necessário para criar a Release

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # pnpm é o gerenciador padrão do projeto (pnpm-lock.yaml é a fonte de verdade)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        shell: bash

      - run: pnpm typecheck
        shell: bash

      - name: Build (renderer/main)
        run: pnpm build
        env:
          # Configure UMA VEZ no repositório:
          #   Settings > Secrets and variables > Actions > Variables:
          #     VITE_SUPABASE_URL
          #   Secrets:
          #     VITE_SUPABASE_ANON_KEY
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        shell: bash

      - name: Trava — sem credenciais, não publica build quebrado
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          if [ -z "${VITE_SUPABASE_URL:-}" ] || [ -z "${VITE_SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Credenciais ausentes! Configure as Variables/Secrets VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY em Settings > Secrets and variables > Actions."
            exit 1
          fi
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # Versão monotônica por número de execução → o electron-updater
      # sempre enxerga a nova como mais recente.
      - name: Empacotar e publicar
        run: >
          pnpm exec electron-builder
          --config.extraMetadata.version=0.1.${{ github.run_number }}
          --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
