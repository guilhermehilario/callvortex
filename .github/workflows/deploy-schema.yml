name: Deploy de schema (Supabase migrations)

# Aplica as migrations versionadas no projeto remoto.
# - Pull request: só faz dry-run (não altera o banco).
# - Push na main mexendo em supabase/migrations/: aplica de verdade.
# - Manual: Actions -> "Deploy de schema" -> Run workflow.
#
# Secrets necessários (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  (Account -> Access Tokens)
#   SUPABASE_DB_PASSWORD   (senha do banco)
# Variable opcional:
#   SUPABASE_PROJECT_REF   (padrão: xgvmxmnsxysbubybxdtq)
#
# Sem os secrets, o workflow encerra com aviso (não falha o build).

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/deploy-schema.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

concurrency:
  group: supabase-schema-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'xgvmxmnsxysbubybxdtq' }}

jobs:
  validar:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Conferir secrets
        id: config
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SUPABASE_ACCESS_TOKEN/SUPABASE_DB_PASSWORD ausentes — dry-run pulado."
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dry-run das migrations pendentes
        if: steps.config.outputs.ok == 'true'
        run: |
          npx supabase db push --dry-run \
            --project-ref "$PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"

  aplicar:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Conferir secrets
        id: config
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Secrets do Supabase ausentes — nada aplicado. Configure-os para ativar o deploy automático."
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Aplicar migrations
        if: steps.config.outputs.ok == 'true'
        run: |
          npx supabase db push \
            --project-ref "$PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Instalar cliente Postgres
        if: steps.config.outputs.ok == 'true'
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Suíte RLS (somente leitura, rollback no fim)
        if: steps.config.outputs.ok == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::notice::DATABASE_URL ausente — suíte RLS pulada."
            exit 0
          fi
          ./scripts/test-screen-share-rls.sh "$DATABASE_URL"
